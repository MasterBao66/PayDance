# Dependabot 依赖更新配置
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# 三个 ecosystem 都不开 automerge：升级 PR 必须过 CI 门禁并由人确认后再合。
# 机器人自己开的升级 PR 在 DCO 门禁里有收紧的豁免，见 scripts/check-dco.mjs。
# 每个 ecosystem 一个 catch-all group：一周最多三条 PR，一条挂了不连累另外两条。

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    labels:
      - dependencies
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      npm:
        patterns:
          - "*"
    # 只挡主版本跳跃，6.x / 24.x 范围内的小版本照常提 PR。
    # 解除封锁时删掉对应条目即可。
    ignore:
      # TypeScript 7 是原生移植版：vue-tsc 无法从中解析 tsc.js
      # （ERR_PACKAGE_PATH_NOT_EXPORTED），typescript-eslint 直接抛
      # "does not support TS 7.0" 拒绝启动。等两者宣布支持后删掉本条。
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # @types/node 跟随运行时主版本：CI 与本地都是 Node 24 LTS，
      # 类型版本超前会让编译期接受运行时并不存在的 API。
      # 升级 CI 的 node-version 时同步放开本条。
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    labels:
      - dependencies
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    labels:
      - dependencies
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - "*"
