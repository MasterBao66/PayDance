name: 功能建议 / Feature Request
description: 提出功能、交互或平台适配建议 / Propose a feature, interaction, or platform adaptation
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        快捷键、提醒通知、历史图表、打卡考勤、账号同步等方向当前不在产品边界内；如果你的需求接近这些范围，请先说明为什么它仍服务于核心体验。完整边界见[产品边界](https://github.com/MrBaoboer/PayDance/blob/main/docs/PRODUCT.md)。
        Shortcuts, notifications, historical charts, attendance tracking, and cloud sync are outside the product boundary. If your request is close to these, explain why it still serves the core experience. See the [Product Boundaries](https://github.com/MrBaoboer/PayDance/blob/main/docs/PRODUCT_EN.md) for the full list.
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Use Case
      description: 你在什么情况下需要它？当前有什么阻碍？ / When do you need this, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果 / Desired Outcome
      description: 说明用户可以看到或完成什么，不必限定实现方式。 / Describe what the user should see or accomplish without prescribing the implementation.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 影响范围 / Surface
      options:
        - Windows 桌面版 / Windows desktop app
        - 平台适配 / Platform adaptation
        - Web Preview
        - 首次配置或设置中心 / First-run setup or Settings
        - 构建、发布或文档 / Build, release, or docs
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: 平台适配说明 / Platform Adaptation Details
      description: "仅平台适配建议填写：目标系统、构建与验证方式、更新方式和可承担的维护范围。 / For platform adaptations only: target system, build and validation method, update method, and maintenance scope."
  - type: textarea
    id: evidence
    attributes:
      label: 补充材料 / Supporting Material
      description: 可附脱敏后的草图、截图或相关链接。 / Add redacted sketches, screenshots, or relevant links.
