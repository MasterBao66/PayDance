name: Bug 反馈 / Bug Report
description: 反馈异常、崩溃、显示或交互问题 / Report errors, crashes, display, or interaction issues
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issue 是公开的。请从截图和日志中删除薪资数据、`salary-settings.json`、私钥、签名密钥和私人路径。
        Issues are public. Remove salary data, `salary-settings.json`, private or signing keys, and private paths from screenshots and logs.
  - type: textarea
    id: summary
    attributes:
      label: 问题摘要 / Summary
      description: 一句话说明哪里出了问题。 / Summarize the problem in one sentence.
      placeholder: "例如：切换到迷你悬浮模式后，透明度面板位置不对齐。 / Example: The opacity panel is misaligned after switching to mini mode."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Reproduction Steps
      description: 列出稳定复现步骤；偶发问题请说明触发场景。 / List reproducible steps, or describe the trigger if the issue is intermittent.
      placeholder: |
        1. 打开应用 / Open the app
        2. 进入设置中心 / Open Settings
        3. 修改 … / Change …
        4. 观察到 … / Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / Expected Result
      description: 正常情况下应该发生什么？ / What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与证据 / Actual Result and Evidence
      description: 说明实际表现，并附脱敏后的截图、录屏、报错或日志。 / Describe what happened and add redacted screenshots, recordings, errors, or logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本 / App Version
      description: 设置中心底部显示的版本。 / The version shown at the bottom of Settings.
      placeholder: vX.Y.Z
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 发生位置 / Surface
      options:
        - Windows 桌面版 / Windows desktop app
        - Web Preview
        - 构建或开发环境 / Build or development environment
        - 文档或发布资产 / Documentation or release assets
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统环境 / System Environment
      description: 填写相关的 Windows、浏览器、Node.js 或 Rust 版本。 / Include relevant Windows, browser, Node.js, or Rust versions.
      placeholder: Windows 11 build / browser version / Node.js version
